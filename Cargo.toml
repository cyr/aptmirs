[package]
name = "aptmirs"
description = "A simple tool for mirroring apt/deb repositories"
authors = ["cyr"]
version = "0.22.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/cyr/aptmirs"
keywords = ["debian", "repository", "apt", "mirror"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8.12"
async-channel = "2.5.0"
async-trait = "0.1.92"
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["cargo", "derive", "env"] }
compact_str = { version = "0.10.0", features = ["serde"] }
console = "0.16.6"
flate2 = "1.1.10"
hex = "0.4.3"
indicatif = "0.18.6"
jiff = "0.2.38"
md5 = "0.8.1"
pathdiff = "0.2.3"
pgp = "0.21.0"
regex = "1.13.1"
reqwest = { version = "0.13.5" }
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "fs"] }
walkdir = "2.5.0"
xz2 = "0.1.7"

[profile.release]
codegen-units = 1
lto = "fat" 
strip = "symbols"
panic = "abort"
